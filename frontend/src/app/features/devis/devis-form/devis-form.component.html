<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Créer un Devis</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="devisForm" (ngSubmit)="onSubmit()">
            <div class="row mb-4">
              <div class="col-md-4">
                <label class="form-label">Numéro Devis</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="numeroDevis"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Date</label>
                <input
                  type="date"
                  class="form-control"
                  formControlName="dateEmission"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Client</label>
                <select class="form-select" formControlName="clientId">
                  <option value="">Sélectionner un client...</option>
                  <option *ngFor="let c of clients" [value]="c.id">
                    {{ c.nom }}
                  </option>
                </select>
              </div>
            </div>

            <hr />

            <h5 class="mb-3">Produits & Services</h5>

            <div formArrayName="lignes">
              <div
                *ngFor="let ligne of lignes.controls; let i = index"
                [formGroupName]="i"
                class="row align-items-end mb-2"
              >
                <div class="col-md-6">
                  <label class="form-label small" *ngIf="i === 0"
                    >Produit</label
                  >
                  <select class="form-select" formControlName="produitId">
                    <option value="">Choisir...</option>
                    <option *ngFor="let p of produits" [value]="p.id">
                      {{ p.nom }} ({{ p.prix }} €)
                    </option>
                  </select>
                </div>

                <div class="col-md-3">
                  <label class="form-label small" *ngIf="i === 0"
                    >Quantité</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    formControlName="quantite"
                  />
                </div>

                <div class="col-md-3">
                  <button
                    type="button"
                    class="btn btn-outline-danger w-100"
                    (click)="supprimerLigne(i)"
                  >
                    <i class="bi bi-trash"></i> Retirer
                  </button>
                </div>
              </div>
            </div>

            <div class="mt-3 mb-5">
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="ajouterLigne()"
              >
                + Ajouter une ligne
              </button>
            </div>

            <div class="d-flex justify-content-end border-top pt-3">
              <a routerLink="/devis" class="btn btn-light me-2">Annuler</a>
              <button
                type="submit"
                class="btn btn-success btn-lg"
                [disabled]="devisForm.invalid || lignes.length === 0"
              >
                Enregistrer le Devis
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
